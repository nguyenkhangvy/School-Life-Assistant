spring.application.name=sla-web

# Settings from .env: the repository root's, or one next to this project.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# 5000: the laptop agent's saved address is http://localhost:5000. Online, the host sets PORT.
server.port=${PORT:5000}
# Only this laptop can open the site, as with the Python site. Online, set SERVER_ADDRESS=0.0.0.0.
server.address=${SERVER_ADDRESS:127.0.0.1}
# Behind Caddy (deploy/server) or Render, Tomcat takes the visitor's address and https from the proxy's X-Forwarded-For
# and X-Forwarded-Proto, and only from a proxy on an internal address. Not "framework": Spring's filter also reads a
# Forwarded header, which Caddy passes on as the visitor sent it, so anyone could pick the address the limits count.
server.forward-headers-strategy=native

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# HTTPS-only cookies unless SESSION_COOKIE_SECURE=false (for http://localhost).
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Flyway creates and changes tables; JPA only checks them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# On a database the Python site already set up, record V1 as done instead of running it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Migrations are named V<date>_<module>_<n>__<what>.sql (module 1 = School, 2 = Social), and files made on different
# branches can arrive in any order.
spring.flyway.out-of-order=true

# Login uses its own AuthenticationProvider (SecurityConfig.passwordLogin, which checks deactivation after the
# password), so Spring Security's warning that it won't build one from AppUserDetailsService is expected.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

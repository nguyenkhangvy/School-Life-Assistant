{% extends "base.html" %}
{% block content %}
  <h1>Hi, {{ current_user.display_name }}</h1>
  <div class="module-grid">
    {% for item in nav_items %}
      {% if item.endpoint %}
        <a class="card module-card" href="{{ url_for(item.endpoint) }}">
          <h2>{{ item.label }}</h2>
        </a>
      {% else %}
        <div class="card module-card is-soon">
          <h2>{{ item.label }}</h2>
          <p>Coming soon</p>
        </div>
      {% endif %}
    {% endfor %}
  </div>
{% endblock %}

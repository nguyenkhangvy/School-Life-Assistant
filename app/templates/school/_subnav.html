{% set school_pages = [
  ("school.index", "Overview"),
  ("school.timetable", "Timetable"),
  ("school.exams", "Exams"),
  ("school.tuition", "Tuition"),
  ("school.devices", "Devices"),
] %}
<nav class="subnav" aria-label="School pages">
  {% for endpoint, label in school_pages %}
    <a href="{{ url_for(endpoint) }}"{% if request.endpoint == endpoint %} aria-current="page"{% endif %}>{{ label }}</a>
  {% endfor %}
</nav>
